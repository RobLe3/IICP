permissions:
  contents: read

jobs:
  fixture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r tools/requirements.txt
      - run: python3 -m pip install "./conformance-runner[signing]"
      - run: python3 -m unittest discover -s conformance-runner/tests
      - run: python3 tools/check_profile_fixture_manifest.py
      - run: python3 -m unittest discover -s tools -p 'test_effective_capability_taxonomy.py'
      - run: python3 -m unittest discover -s tools -p 'test_runtime_identity_context.py'
      - run: python3 -m unittest discover -s tools -p 'test_environmental_independence.py'
      - run: python3 -m unittest discover -s tools -p 'test_environmental_independence_decision.py'
      - run: python3 tools/check_intent_registry.py
      - run: python3 tools/check_intent_registry_schema.py
      - run: python3 -m unittest discover -s tools -p 'test_intent_registry.py'
      - run: python3 -m unittest discover -s tools -p 'test_intent_payload_fixture.py'
      - run: python3 tools/audit_intent_sources.py --check
      - run: python3 -m unittest discover -s tools -p 'test_service_lifecycle_fixture.py'
      - run: python3 tools/test_mcp_era_fixture.py
      - run: python3 tools/check_e050_client_credential_lifecycle.py
      - run: python3 -m unittest discover -s tools -p 'test_e050_client_credential_lifecycle.py'
      - run: python3 tools/test_reputation_hourly_velocity_fixture.py
      - run: python3 -m unittest discover -s tools -p 'test_terminology_discoverability.py'
      - run: python3 tools/check_runtime_health_fixture.py
      - run: python3 tools/check_public_measurement_profile.py
      - run: python3 -m unittest discover -s tools -p 'test_public_measurement_profile.py'
      - run: python3 tools/check_a2a_execution_binding.py
      - run: python3 -m unittest discover -s tools -p 'test_a2a_execution_binding.py'
      - run: python3 -m unittest discover -s tools -p 'test_a2a_cross_runtime_loopback.py'
      - run: python3 tools/check_dns_aid_mapping.py
      - run: python3 -m unittest discover -s tools -p 'test_dns_aid_mapping.py'
      - run: python3 tools/check_identity_evidence_layering.py
      - run: python3 -m unittest discover -s tools -p 'test_identity_evidence_layering.py'
      - run: python3 tools/check_security_considerations_coverage.py
      - run: python3 -m unittest discover -s tools -p 'test_security_considerations_coverage.py'
      - run: python3 tools/check_operator_onboarding_recovery.py
      - run: python3 -m unittest discover -s tools -p 'test_operator_onboarding_recovery.py'
      - run: python3 tools/check_newcomer_validation_record.py
      - run: python3 -m unittest discover -s tools -p 'test_newcomer_validation_record.py'
      - run: python3 tools/check_clean_room_interoperability_record.py
      - run: python3 -m unittest discover -s tools -p 'test_clean_room_interoperability_record.py'
      - run: python3 tools/check_external_participation_campaign.py
      - run: python3 -m unittest discover -s tools -p 'test_external_participation_campaign.py'
      - run: python3 tools/check_submission_governance_decision.py
      - run: python3 -m unittest discover -s tools -p 'test_submission_governance_decision.py'
      - run: python3 tools/check_signed_message_envelope_boundary.py
      - run: python3 -m unittest discover -s tools -p 'test_signed_message_envelope_boundary.py'
      - run: python3 tools/check_public_evidence_access.py
      - run: python3 -m unittest discover -s tools -p 'test_public_evidence_access.py'
      - run: python3 tools/check_spec_release_integrity.py
      - run: python3 tools/check_discovery_sdk_currency.py
