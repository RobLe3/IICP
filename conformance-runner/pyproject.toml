[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iicp-conformance"
version = "0.1.0"
description = "Standalone, content-free black-box conformance runner for IICP"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
signing = ["cryptography>=42"]

[project.scripts]
iicp-conformance = "iicp_conformance.cli:main"

[tool.setuptools.package-data]
iicp_conformance = ["fixtures/*.json"]
