[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iicp-conformance"
version = "0.3.0"
description = "Standalone, content-free black-box conformance runner for IICP"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = []

[project.optional-dependencies]
signing = ["cryptography>=42", "rfc8785>=0.1.4"]

[project.scripts]
iicp-conformance = "iicp_conformance.cli:main"

[tool.setuptools.package-data]
iicp_conformance = ["fixtures/*.json"]
